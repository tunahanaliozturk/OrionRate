<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="575" viewBox="0 0 1200 575">
  <!--
    Orion family diagram template. Copy it, keep <defs> and <style>, replace the body.
    Classes: .step (our code) .ext (backend / external system) .ok (success end) .fail (failure path)
             .decision (diamond) .note (side remark) .lane (sequence lifeline)
    Arrows: class="flow" (main path), "flow alt" (alternate / failure path, dashed), "flow back" (response).
  -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; fill: #1e1b4b; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #475569; }
    .label { font-size: 15px; font-weight: 600; }
    .small { font-size: 12.5px; fill: #475569; }
    .code { font-family: "Cascadia Code", Consolas, "SF Mono", monospace; font-size: 13px; fill: #3730a3; }
    .edge { font-size: 12.5px; fill: #334155; }
    .step { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
    .ext { fill: #f0f9ff; stroke: #0284c7; stroke-width: 2; }
    .ok { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
    .fail { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }
    .decision { fill: #fffbeb; stroke: #d97706; stroke-width: 2; }
    .note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .lane { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .flow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    .flow.alt { stroke: #dc2626; stroke-dasharray: 6 4; marker-end: url(#arrow-fail); }
    .flow.back { stroke-dasharray: 6 4; }
    .badge { fill: #4f46e5; }
    .badge-text { font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>

  <rect width="1200" height="575" fill="#ffffff"/>

  <text class="title" x="40" y="52">OrionRate - packages and how the app reaches them</text>
  <text class="subtitle" x="40" y="78">Policies are defined once at startup; your code or the ASP.NET Core endpoint filter asks the in-memory limiter for a decision.</text>

  <!-- row 1: registration -->
  <rect class="step" x="40" y="115" width="230" height="100" rx="14"/>
  <text class="label" x="155" y="160" text-anchor="middle">Startup</text>
  <text class="small" x="155" y="184" text-anchor="middle">Program.cs, once</text>

  <path class="flow" d="M270,165 L378,165"/>

  <rect class="step" x="380" y="115" width="420" height="100" rx="14"/>
  <text class="code" x="590" y="150" text-anchor="middle" style="font-variant-ligatures: none">services.AddOrionRate(o =&gt;</text>
  <text class="code" x="590" y="172" text-anchor="middle" style="font-variant-ligatures: none">o.AddPolicy(name, p =&gt; ...))</text>
  <text class="small" x="590" y="198" text-anchor="middle">also AddOrionClock; TryAdd, so an earlier registration wins</text>

  <path class="flow" d="M800,165 L888,165"/>
  <text class="edge" x="845" y="155" text-anchor="middle">AddPolicy</text>

  <rect class="step" x="890" y="115" width="270" height="100" rx="14"/>
  <text class="code" x="1025" y="147" text-anchor="middle">RateLimitPolicy</text>
  <text class="code" x="1025" y="172" text-anchor="middle">TokenBucket(permit, per, burst)</text>
  <text class="code" x="1025" y="194" text-anchor="middle">SlidingWindow(permit, window)</text>

  <path class="flow" d="M590,215 L590,263"/>
  <text class="edge" x="602" y="244">registers singleton</text>

  <!-- row 2: callers, limiter, dependencies -->
  <rect class="step" x="40" y="265" width="230" height="80" rx="14"/>
  <text class="label" x="155" y="299" text-anchor="middle">Your code</text>
  <text class="small" x="155" y="322" text-anchor="middle">injects IRateLimiter</text>

  <path class="flow" d="M270,305 L378,305"/>
  <text class="edge" x="324" y="295" text-anchor="middle">AcquireAsync</text>

  <rect class="step" x="40" y="365" width="230" height="80" rx="14"/>
  <text class="label" x="155" y="393" text-anchor="middle">OrionRate.AspNetCore</text>
  <text class="code" x="155" y="416" text-anchor="middle">RequireOrionRateLimit</text>
  <text class="small" x="155" y="435" text-anchor="middle">endpoints and route groups</text>

  <path class="flow" d="M270,405 L378,405"/>
  <text class="edge" x="324" y="395" text-anchor="middle">AcquireAsync</text>

  <rect class="step" x="380" y="265" width="420" height="180" rx="14"/>
  <text class="code" x="590" y="300" text-anchor="middle">RateLimiter : IRateLimiter</text>
  <text class="small" x="590" y="328" text-anchor="middle">in-memory, one budget per process</text>
  <text class="small" x="590" y="350" text-anchor="middle">one partition and lock per (policy, key)</text>
  <text class="small" x="590" y="372" text-anchor="middle">check-and-consume is atomic per key</text>
  <text class="small" x="590" y="394" text-anchor="middle">returns RateResult: Allowed, Limit, Remaining, RetryAfter</text>
  <text class="small" x="590" y="416" text-anchor="middle">idle partitions are swept</text>

  <path class="flow" d="M800,305 L888,305"/>
  <text class="edge" x="845" y="295" text-anchor="middle">Record</text>

  <rect class="step" x="890" y="265" width="270" height="80" rx="14"/>
  <text class="code" x="1025" y="294" text-anchor="middle">RateDiagnostics</text>
  <text class="small" x="1025" y="316" text-anchor="middle">meter Moongazing.OrionRate</text>
  <text class="small" x="1025" y="335" text-anchor="middle">allowed, throttled, remaining</text>

  <path class="flow" d="M800,405 L888,405"/>
  <text class="edge" x="845" y="395" text-anchor="middle">reads time</text>

  <rect class="ext" x="890" y="365" width="270" height="80" rx="14"/>
  <text class="code" x="1025" y="394" text-anchor="middle">IOrionClock</text>
  <text class="small" x="1025" y="416" text-anchor="middle">OrionClock, via AddOrionClock</text>
  <text class="small" x="1025" y="435" text-anchor="middle">all refill and window math</text>

  <!-- note -->
  <rect class="note" x="40" y="475" width="1120" height="70" rx="10"/>
  <text class="small" x="60" y="503">No DI: RateLimiter.Create(options, clock). Tests: FakeOrionClock (package OrionClock.Testing) and Advance, no real waiting.</text>
  <text class="small" x="60" y="525">Budgets are per process: three replicas behind a load balancer admit up to three times the limit. There is no shared store yet.</text>
</svg>
