<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="855" viewBox="0 0 1200 855">
  <!--
    Orion family diagram template. Copy it, keep <defs> and <style>, replace the body.
    Classes: .step (our code) .ext (backend / external system) .ok (success end) .fail (failure path)
             .decision (diamond) .note (side remark) .lane (sequence lifeline)
    Arrows: class="flow" (main path), "flow alt" (alternate / failure path, dashed), "flow back" (response).
  -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; fill: #1e1b4b; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #475569; }
    .label { font-size: 15px; font-weight: 600; }
    .small { font-size: 12.5px; fill: #475569; }
    .code { font-family: "Cascadia Code", Consolas, "SF Mono", monospace; font-size: 13px; fill: #3730a3; }
    .edge { font-size: 12.5px; fill: #334155; }
    .step { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
    .ext { fill: #f0f9ff; stroke: #0284c7; stroke-width: 2; }
    .ok { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
    .fail { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }
    .decision { fill: #fffbeb; stroke: #d97706; stroke-width: 2; }
    .note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .lane { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .flow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    .flow.alt { stroke: #dc2626; stroke-dasharray: 6 4; marker-end: url(#arrow-fail); }
    .flow.back { stroke-dasharray: 6 4; }
    .badge { fill: #4f46e5; }
    .badge-text { font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>

  <rect width="1200" height="855" fill="#ffffff"/>

  <text class="title" x="40" y="52">OrionRate.AspNetCore - RequireOrionRateLimit endpoint filter</text>
  <text class="subtitle" x="40" y="78">The filter runs before the endpoint. A rejected request gets 429 with Retry-After, and the endpoint does not run.</text>

  <!-- request -->
  <rect class="step" x="40" y="115" width="240" height="70" rx="14"/>
  <text class="label" x="160" y="146" text-anchor="middle">Request</text>
  <text class="small" x="160" y="168" text-anchor="middle">endpoint or route group</text>

  <path class="flow" d="M280,150 L328,150"/>

  <rect class="step" x="330" y="115" width="320" height="70" rx="14"/>
  <text class="code" x="490" y="146" text-anchor="middle">keySelector(HttpContext)</text>
  <text class="small" x="490" y="168" text-anchor="middle">trusted, normalized identity</text>

  <path class="flow" d="M650,150 L698,150"/>

  <!-- D1: blank key -->
  <polygon class="decision" points="810,95 920,150 810,205 700,150"/>
  <text class="label" x="810" y="146" text-anchor="middle">Key blank?</text>
  <text class="small" x="810" y="166" text-anchor="middle">null, empty, spaces</text>

  <path class="flow alt" d="M920,150 L968,150"/>
  <text class="edge" x="944" y="140" text-anchor="middle">yes</text>
  <rect class="fail" x="970" y="100" width="190" height="100" rx="14"/>
  <text class="label" x="1065" y="128" text-anchor="middle">Throws</text>
  <text class="small" x="1065" y="150" text-anchor="middle">InvalidOperationException</text>
  <text class="small" x="1065" y="170" text-anchor="middle">fails closed:</text>
  <text class="small" x="1065" y="188" text-anchor="middle">endpoint not run</text>

  <!-- acquire -->
  <path class="flow" d="M810,205 L810,243"/>
  <text class="edge" x="822" y="229">no</text>
  <rect class="step" x="560" y="245" width="500" height="80" rx="14"/>
  <text class="code" x="810" y="272" text-anchor="middle">IRateLimiter.AcquireAsync(policy, key,</text>
  <text class="code" x="810" y="292" text-anchor="middle">permits, RequestAborted)</text>
  <text class="small" x="810" y="314" text-anchor="middle">resolved from HttpContext.RequestServices</text>

  <path class="flow" d="M810,325 L810,363"/>
  <rect class="step" x="560" y="365" width="500" height="70" rx="14"/>
  <text class="label" x="810" y="394" text-anchor="middle">Set headers on both outcomes</text>
  <text class="code" x="810" y="419" text-anchor="middle">RateLimit-Limit, RateLimit-Remaining</text>

  <!-- D2: allowed -->
  <path class="flow" d="M810,435 L810,473"/>
  <polygon class="decision" points="810,475 920,530 810,585 700,530"/>
  <text class="code" x="810" y="535" text-anchor="middle">Allowed?</text>

  <path class="flow" d="M920,530 L968,530"/>
  <text class="edge" x="944" y="520" text-anchor="middle">yes</text>
  <rect class="ok" x="970" y="490" width="190" height="80" rx="14"/>
  <text class="code" x="1065" y="524" text-anchor="middle">next(context)</text>
  <text class="small" x="1065" y="547" text-anchor="middle">the endpoint runs</text>

  <path class="flow alt" d="M810,585 L810,623"/>
  <text class="edge" x="822" y="609">no</text>
  <rect class="step" x="560" y="625" width="500" height="80" rx="14"/>
  <text class="code" x="810" y="656" text-anchor="middle">Retry-After</text>
  <text class="small" x="810" y="680" text-anchor="middle">RateResult.RetryAfter rounded up to whole seconds, at least 1</text>

  <path class="flow alt" d="M810,705 L810,743"/>
  <rect class="fail" x="560" y="745" width="500" height="80" rx="14"/>
  <text class="label" x="810" y="776" text-anchor="middle">429 Too Many Requests</text>
  <text class="small" x="810" y="800" text-anchor="middle">problem details from Results.Problem; the endpoint does not run</text>

  <!-- note -->
  <rect class="note" x="40" y="365" width="470" height="180" rx="10"/>
  <text class="small" x="60" y="395">Register the policy with AddOrionRate before mapping endpoints.</text>
  <text class="small" x="60" y="419">permits (default 1) is what each request costs.</text>
  <text class="small" x="60" y="443">Build keys from authenticated, normalized identities;</text>
  <text class="small" x="60" y="467">never trust a client-supplied identity header.</text>
  <text class="small" x="60" y="491">The budget is the in-memory limiter's: one per process,</text>
  <text class="small" x="60" y="515">not shared between replicas.</text>
</svg>
